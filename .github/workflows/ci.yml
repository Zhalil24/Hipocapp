name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The env files are not in the repository; CI uses a placeholder URL.
      - name: Create env files
        run: |
          mkdir -p module/gen/assets/env
          echo "BASE_URL=${BASE_URL:-https://api.example.invalid}" > module/gen/assets/env/.dev.env
          echo "BASE_URL=${BASE_URL:-https://api.example.invalid}" > module/gen/assets/env/.prod.env
        env:
          BASE_URL: ${{ secrets.BASE_URL }}

      - run: flutter pub get

      - name: Generate code
        run: |
          (cd module/gen && dart run build_runner build --delete-conflicting-outputs)
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
